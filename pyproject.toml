[project]
name = "pysms"
version = "0.1.0"
description = "A Python library for handling SMS messages through serial port communication with GSM modems"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=22.0",
    "flake8>=4.0",
    "bandit[toml]>=1.7",
    "safety>=2.0",
    "twine>=4.0",
]

[project.scripts]
pysms-cli = "pysms.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
