[project]
name = "pysms"
version = "0.1.0"
description = "A Python library for handling SMS messages through serial port communication with GSM modems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "black>=26.5.1",
    "flake8>=7.3.0",
    "bandit[toml]>=1.9.4",
    "safety>=3.8.1",
    "twine>=6.2.0",
    "ruff>=0.15.14",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.409",
]

[project.scripts]
pysms-cli = "pysms.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
