[project]
name = "pysms"
version = "0.1.0"
description = "A Python library for handling SMS messages through serial port communication with GSM modems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "typer>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "black>=26.3.1",
    "flake8>=4.0",
    "bandit[toml]>=1.7",
    "safety>=3.7.0",
    "twine>=4.0",
    "ruff>=0.15.10",
    "pytest-cov>=7.1.0",
    "pyright>=1.1.407",
]

[project.scripts]
pysms-cli = "pysms.cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
